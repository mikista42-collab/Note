<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catatan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    body {
      background: #f4f4f5;
      padding: 16px;
    }
    .wadah {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
    }
    h1 {
      font-size: 1.2rem;
      margin-bottom: 12px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d4d4d8;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }
    .daftar {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .kartu {
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      padding: 10px;
      background: #fafafa;
    }
    .judul-catatan {
      font-weight: bold;
      margin-bottom: 4px;
    }
    .isi-catatan {
      font-size: 0.9rem;
      white-space: pre-wrap;
      margin-bottom: 8px;
    }
    .btn-hapus {
      width: auto;
      padding: 5px 10px;
      background: #dc2626;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="wadah">
    <h1>Catatan</h1>
    <input type="text" id="judul" placeholder="Judul..." />
    <textarea id="isi" placeholder="Tulis catatan..."></textarea>
    <button onclick="tambahCatatan()">Simpan</button>
    <div class="daftar" id="daftar"></div>
  </div>

  <script>
    let catatan = JSON.parse(localStorage.getItem("data_catatan")) || [];

    function simpan() {
      localStorage.setItem("data_catatan", JSON.stringify(catatan));
    }

    function tambahCatatan() {
      const judulEl = document.getElementById("judul");
      const isiEl = document.getElementById("isi");
      const judul = judulEl.value.trim();
      const isi = isiEl.value.trim();

      if (!judul && !isi) return;

      catatan.unshift({
        judul: judul || "Tanpa Judul",
        isi: isi
      });

      judulEl.value = "";
      isiEl.value = "";
      simpan();
      render();
    }

    function hapusCatatan(i) {
      catatan.splice(i, 1);
      simpan();
      render();
    }

    function render() {
      const daftar = document.getElementById("daftar");
      daftar.innerHTML = "";

      catatan.forEach((item, i) => {
        const div = document.createElement("div");
        div.className = "kartu";

        const j = document.createElement("div");
        j.className = "judul-catatan";
        j.textContent = item.judul;

        const is = document.createElement("div");
        is.className = "isi-catatan";
        is.textContent = item.isi;

        const btn = document.createElement("button");
        btn.className = "btn-hapus";
        btn.textContent = "Hapus";
        btn.onclick = () => hapusCatatan(i);

        div.appendChild(j);
        div.appendChild(is);
        div.appendChild(btn);
        daftar.appendChild(div);
      });
    }

    render();
  </script>
</body>
</html>
